# Configuración del puente hoverboard_bridge para MILO (probada en el robot real el 10-11-2026;
# seta de emergencia y prueba de fallas el 16-11-2026). Los valores por defecto de bridge.py son
# estos mismos: si se cambia uno aquí, cambiarlo también allá.
# La carga robot.launch.py (driver:=bridge). La calibración de ruedas está en
# hoverboard_calibracion.yaml (misma carpeta); se regenera con:
#   ros2 run hoverboard_bridge calibrar --port <puerto>   (RUEDAS EN EL AIRE)
# y se copia aquí desde ~/.ros/hoverboard_calibracion.yaml.
# "/**" = vale para el nodo con cualquier nombre (base_driver_node por defecto; robot.launch.py
# puede lanzarlo como hoverboard_bridge).
/**:
  ros__parameters:
    baud_rate: 115200
    # Geometría
    wheel_radius: 0.08255         # [m] rueda de hoverboard 6.5"
    # Separación EFECTIVA para la odometría. Física medida: 0.32 m (centro a centro de los
    # neumáticos). Calibrada con el lidar (ICP, 1 vuelta en el lugar): 0.32 * 1.081 = 0.346
    # (las ruedas patinan al girar). URDF/CAD dicen 0.3604.
    wheel_separation: 0.346
    ticks_per_rev: 90.0           # pasos Hall por vuelta (medido: 90.6 / 90.0)
    # El firmware cuenta 0..8999 (wrap en protocolo.py, ENCODER_WRAP = 9000)
    # Límites
    max_command: 400              # tope de |speed| y |steer| al firmware (de 1000)
    max_linear: 1.67              # [m/s] = 6 km/h
    max_angular: 0.6              # [rad/s] giro (~34°/s); era 0.4 (11-11-2026: un poco más rápido)
    # Rampas: acelerar MUY suave, frenar fuerte (seguridad)
    linear_accel: 0.25            # [m/s²] 0 -> 6 km/h en ~6.7 s (11-11-2026: era 0.5, muy brusco)
    linear_decel: 1.0             # [m/s²] frenar fuerte: 6 km/h -> 0 en ~1.7 s (~1.4 m), lo necesita el filtro de seguridad
    angular_accel: 0.5            # [rad/s²] (era 0.8)
    angular_decel: 1.2            # [rad/s²]
    # PI propio sobre RPM: APAGADO (el firmware ya controla velocidad; con PI temblaba al frenar)
    kp: 0.0
    ki: 0.0
    integral_limit: 40.0
    # Seguridad / robustez
    cmd_timeout: 0.5              # [s] sin cmd_vel -> parar
    feedback_timeout: 0.5         # [s] sin feedback del hoverboard -> parar
    stall_reopen: 1.5             # [s] puerto abierto pero mudo (CH340 colgado) -> reabrir
    rate: 50.0                    # [Hz]
    # Frames / joints
    odom_frame: odom
    base_frame: base_footprint
    # Odometría (contrato AndesRobot): mientras no haya odom_ekf_node en el robot real, este nodo
    # publica /base/odom + TF; con el EKF: odom_topic: /base/wheel_odom, publish_tf: false.
    odom_topic: /base/odom
    odom_compat_topic: /odom   # copia para Navegación mientras pasa a /base/odom ('' = sin copia)
    publish_tf: true
    left_joint: left_wheel_joint
    right_joint: right_wheel_joint
    # Batería 10S 18650: 36 V nominal, 42 V llena, 12.5 Ah
    bat_cells: 10
    bat_capacity_ah: 12.5
    bat_warn: 34.0          # 3.40 V/celda: aviso + velocidad al 50 %
    bat_warn_speed: 0.5
    bat_cutoff: 32.0        # 3.20 V/celda: motores bloqueados
    bat_resume: 35.0        # 3.50 V/celda: se desbloquea al cargar
    bat_overvoltage: 42.3   # aviso de sobrecarga (el cargador debe cortar en 42.0)
    bat_filter_tau: 5.0     # [s] filtro del voltaje
    # Seta de emergencia física: botón NC entre pin 1 (3.3 V) y pin 7 (GPIO09 = PAC.06), con el
    # pull-down del overlay seta_emergencia/overlay. Pin en 0 = presionada o cable cortado.
    # Al soltarla el robot sigue parado hasta pulsar LIBERAR en el panel (/emergencia False).
    estop_gpio_chip: gpiochip0
    estop_gpio_line: 144    # < 0 desactiva la seta física
    estop_gpio_period: 0.05 # [s] lectura a 20 Hz
    estop_gpio_fail: 1.0    # [s] sin poder leer el pin -> se toma como presionada (falla segura)
